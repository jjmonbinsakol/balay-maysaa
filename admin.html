<!DOCTYPE html>
<html>
<head>
    <title>Admin - Balay Maysa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow max-w-md w-full">
            <h1 class="text-2xl font-bold text-center text-green-800">Admin Login</h1>
            <form id="loginForm" class="mt-6">
                <input type="text" id="username" placeholder="Username" class="w-full border p-2 rounded mb-3" required>
                <input type="password" id="password" placeholder="Password" class="w-full border p-2 rounded mb-3" required>
                <button type="submit" class="w-full bg-green-800 text-white py-2 rounded">Login</button>
            </form>
            <div id="errorMsg" class="text-red-600 text-center mt-3 hidden"></div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === 'balayadmin' && pass === 'BalayMaysa2026') {
                alert('Login successful! View bookings: Check Supabase table.');
            } else {
                document.getElementById('errorMsg').innerText = 'Invalid credentials';
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
