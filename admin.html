<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balay Maysa - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; font-family: system-ui, 'Segoe UI', sans-serif; }
        .status-pending { background: #fef3c7; color: #b45309; }
        .status-confirmed { background: #d1fae5; color: #065f46; }
        .status-declined { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <!-- Login Panel -->
    <div id="loginPanel" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#2d5a3b] to-[#1e3d28]">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-6">
                <i class="fas fa-lock text-4xl text-[#c9a03d]"></i>
                <h2 class="text-2xl font-bold mt-2">Admin Access</h2>
                <p class="text-gray-500">Balay Maysa Management</p>
            </div>
            <form id="adminLoginForm">
                <input type="text" id="adminUsername" placeholder="Username" class="w-full border p-3 rounded-lg mb-3" required>
                <input type="password" id="adminPassword" placeholder="Password" class="w-full border p-3 rounded-lg mb-4" required>
                <button type="submit" class="w-full bg-[#2d5a3b] text-white py-3 rounded-lg font-bold">Login</button>
            </form>
            <div id="loginError" class="text-red-600 text-center text-sm mt-3 hidden"></div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
        <nav class="bg-[#2d5a3b] text-white px-6 py-4 shadow-lg flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-umbrella-beach text-xl"></i>
                <span class="font-bold text-xl">Balay Maysa · Admin</span>
            </div>
            <button id="logoutBtn" class="bg-red-700 px-4 py-2 rounded-lg hover:bg-red-800">Logout</button>
        </nav>
        
        <div class="p-6 max-w-7xl mx-auto">
            <!-- Stats Cards -->
            <div class="grid md:grid-cols-4 gap-5 mb-8">
                <div class="bg-white p-5 rounded-xl shadow"><p class="text-gray-500">Pending</p><p id="statPending" class="text-3xl font-bold text-[#c9a03d]">0</p></div>
                <div class="bg-white p-5 rounded-xl shadow"><p class="text-gray-500">Confirmed</p><p id="statConfirmed" class="text-3xl font-bold text-green-600">0</p></div>
                <div class="bg-white p-5 rounded-xl shadow"><p class="text-gray-500">Total Bookings</p><p id="statTotal" class="text-3xl font-bold">0</p></div>
                <div class="bg-white p-5 rounded-xl shadow"><p class="text-gray-500">Blocked Dates</p><p id="statBlocked" class="text-3xl font-bold">0</p></div>
            </div>
            
            <!-- Tabs -->
            <div class="flex gap-2 border-b mb-6">
                <button id="tabPendingBtn" class="py-2 px-5 font-semibold text-[#2d5a3b] border-b-2 border-[#c9a03d]">📋 Pending</button>
                <button id="tabConfirmedBtn" class="py-2 px-5 font-semibold text-gray-500">✅ Confirmed</button>
                <button id="tabBlockBtn" class="py-2 px-5 font-semibold text-gray-500">🚫 Block Dates</button>
            </div>
            
            <!-- Pending Section -->
            <div id="pendingSection" class="bg-white rounded-xl shadow overflow-x-auto">
                <table class="min-w-full">
                    <thead class="bg-gray-100">
                        <tr><th class="p-3">Date</th><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Adults</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="pendingTableBody"><tr><td colspan="7" class="text-center p-6">Loading...</td></tr></tbody>
                </table>
            </div>
            
            <!-- Confirmed Section -->
            <div id="confirmedSection" class="hidden bg-white rounded-xl shadow overflow-x-auto">
                <table class="min-w-full">
                    <thead class="bg-gray-100"><tr><th class="p-3">Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Status</th></tr></thead>
                    <tbody id="confirmedTableBody"></tbody>
                </table>
            </div>
            
            <!-- Block Dates Section -->
            <div id="blockSection" class="hidden bg-white rounded-xl p-5 shadow">
                <div class="flex gap-3 flex-wrap mb-6">
                    <input type="date" id="newBlockDate" class="border p-2 rounded">
                    <input type="text" id="blockReason" placeholder="Reason (maintenance/event)" class="border p-2 rounded flex-1">
                    <button id="addBlockBtn" class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700">+ Block Date</button>
                </div>
                <table class="w-full">
                    <thead><tr><th class="p-2 text-left">Date</th><th class="p-2 text-left">Reason</th><th class="p-2">Action</th></tr></thead>
                    <tbody id="blockedDatesList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // EmailJS initialization with your public key
        emailjs.init('yupgCoqLB4unb0OAz');
        
        // SUPABASE CONFIGURATION - REPLACE WITH YOUR ACTUAL KEY
        const SUPABASE_URL = 'https://vhtcefsfvpeafukzdxmj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9hJ_a1e14l3lFxkhnc8aRQ_lmTFbNq2';  // ← IMPORTANT: REPLACE THIS
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const ADMIN_USER = 'balayadmin';
        const ADMIN_PASS = 'BalayMaysa2026';
        
        let isLogged = false;
        
        // Login handler
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            
            if (username === ADMIN_USER && password === ADMIN_PASS) {
                isLogged = true;
                document.getElementById('loginPanel').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadAllData();
                setInterval(() => { if(isLogged) loadAllData(); }, 30000);
            } else {
                document.getElementById('loginError').innerText = 'Invalid username or password';
                document.getElementById('loginError').classList.remove('hidden');
                setTimeout(() => document.getElementById('loginError').classList.add('hidden'), 2000);
            }
        });
        
        // Logout
        document.getElementById('logoutBtn').onclick = () => {
            isLogged = false;
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginPanel').classList.remove('hidden');
            document.getElementById('adminUsername').value = '';
            document.getElementById('adminPassword').value = '';
        };
        
        // Load all data
        async function loadAllData() {
            await Promise.all([loadPending(), loadConfirmed(), loadStats(), loadBlockedDates()]);
        }
        
        // Send confirmation email with Google Calendar link
        async function sendConfirmationEmail(guestEmail, guestName, bookingRef, checkIn, checkOut, roomType) {
            const calendarLink = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=Balay+Maysa+Booking+${bookingRef}&dates=${checkIn.replace(/-/g, '')}/${checkOut.replace(/-/g, '')}&details=Your+stay+at+Balay+Maysa+Resort.+Room:+${roomType}+Booking+Ref:+${bookingRef}&location=Blk+8+Lot+12+M.Cuenco+St.,+Congress+Village,+Caloocan+North&sf=true&output=xml`;
            
            const emailContent = `
                <div style="font-family: Arial, sans-serif; max-width: 500px; margin: auto; background: #f5f0e8; padding: 20px; border-radius: 15px;">
                    <h2 style="color: #2d5a3b;">🌴 Balay Maysa Resort</h2>
                    <p>Hello <strong>${guestName}</strong>,</p>
                    <p>Your booking has been <strong style="color: green;">CONFIRMED!</strong> 🎉</p>
                    <div style="background: white; padding: 15px; border-radius: 10px; margin: 15px 0;">
                        <p><strong>📋 Booking Details:</strong></p>
                        <p>Reference: ${bookingRef}<br>
                        Room: ${roomType}<br>
                        Check-in: ${checkIn}<br>
                        Check-out: ${checkOut}</p>
                    </div>
                    <p><strong>📅 Add to your calendar:</strong></p>
                    <p><a href="${calendarLink}" style="background: #c9a03d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 25px;">Click here to add to Google Calendar</a></p>
                    <p>We look forward to hosting you!</p>
                    <p>Warm regards,<br>Balay Maysa Team<br>📞 0917 565 7918</p>
                </div>
            `;
            
            try {
                await fetch('https://api.emailjs.com/api/v1.0/email/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        service_id: 'service_t13ealt',
                        user_id: 'yupgCoqLB4unb0OAz',
                        template_params: {
                            to_email: guestEmail,
                            to_name: guestName,
                            subject: `Balay Maysa Booking CONFIRMED - ${bookingRef}`,
                            message_html: emailContent
                        }
                    })
                });
                return true;
            } catch(e) {
                console.error('Email error:', e);
                return false;
            }
        }
        
        // Load pending bookings
        async function loadPending() {
            const { data, error } = await supabase
                .from('bookings')
                .select('*')
                .eq('status', 'pending_approval')
                .order('created_at', { ascending: true });
            
            const tbody = document.getElementById('pendingTableBody');
            if (error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-gray-400">No pending requests</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.map(booking => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 text-sm">${new Date(booking.created_at).toLocaleDateString()}</td>
                    <td class="p-3 font-medium">${booking.guest_name}</td>
                    <td class="p-3 capitalize">${booking.room_type}</td>
                    <td class="p-3">${booking.check_in_date}</td>
                    <td class="p-3">${booking.check_out_date}</td>
                    <td class="p-3">${booking.adults}</td>
                    <td class="p-3">
                        <button onclick="approveBooking('${booking.id}', '${booking.guest_email}', '${booking.guest_name}', '${booking.check_in_date}', '${booking.check_out_date}', '${booking.room_type}', '${booking.booking_ref}')" class="bg-green-600 text-white px-3 py-1 rounded mr-2 hover:bg-green-700">✓ Confirm</button>
                        <button onclick="declineBooking('${booking.id}', '${booking.guest_email}', '${booking.guest_name}', '${booking.booking_ref}')" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">✗ Decline</button>
                    </td>
                </tr>
            `).join('');
        }
        
        // Load confirmed bookings
        async function loadConfirmed() {
            const { data, error } = await supabase
                .from('bookings')
                .select('*')
                .eq('status', 'confirmed')
                .order('check_in_date', { ascending: true });
            
            const tbody = document.getElementById('confirmedTableBody');
            if (error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-gray-400">No confirmed bookings</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.map(booking => `
                <tr class="border-b">
                    <td class="p-3">${booking.guest_name}</td>
                    <td class="p-3 capitalize">${booking.room_type}</td>
                    <td class="p-3">${booking.check_in_date}</td>
                    <td class="p-3">${booking.check_out_date}</td>
                    <td class="p-3"><span class="status-confirmed px-2 py-1 rounded text-sm">Confirmed</span></td>
                </tr>
            `).join('');
        }
        
        // Load statistics
        async function loadStats() {
            const { count: pending } = await supabase.from('bookings').select('*', { count: 'exact', head: true }).eq('status', 'pending_approval');
            const { count: confirmed } = await supabase.from('bookings').select('*', { count: 'exact', head: true }).eq('status', 'confirmed');
            const { count: total } = await supabase.from('bookings').select('*', { count: 'exact', head: true });
            const { count: blocked } = await supabase.from('blocked_dates').select('*', { count: 'exact', head: true });
            
            document.getElementById('statPending').innerText = pending || 0;
            document.getElementById('statConfirmed').innerText = confirmed || 0;
            document.getElementById('statTotal').innerText = total || 0;
            document.getElementById('statBlocked').innerText = blocked || 0;
        }
        
        // Load blocked dates
        async function loadBlockedDates() {
            const { data, error } = await supabase.from('blocked_dates').select('*').order('block_date', { ascending: true });
            const tbody = document.getElementById('blockedDatesList');
            if (error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center p-3 text-gray-400">No blocked dates</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.map(block => `
                <tr class="border-b">
                    <td class="p-2">${block.block_date}</td>
                    <td class="p-2">${block.reason || '—'}</td>
                    <td class="p-2"><button onclick="deleteBlockedDate('${block.id}')" class="text-red-500 hover:text-red-700 text-sm">Remove</button></td>
                </tr>
            `).join('');
        }
        
        // Approve booking
        window.approveBooking = async (id, email, name, checkIn, checkOut, room, ref) => {
            if (!confirm(`Confirm booking ${ref} for ${name}?`)) return;
            
            const { error } = await supabase
                .from('bookings')
                .update({ status: 'confirmed', confirmed_at: new Date().toISOString() })
                .eq('id', id);
            
            if (error) {
                alert('Error: ' + error.message);
            } else {
                await sendConfirmationEmail(email, name, ref, checkIn, checkOut, room);
                alert(`✅ Booking ${ref} confirmed! Email sent to ${email} with calendar invite.`);
                loadAllData();
            }
        };
        
        // Decline booking
        window.declineBooking = async (id, email, name, ref) => {
            if (!confirm(`Decline booking ${ref} for ${name}?`)) return;
            
            const { error } = await supabase
                .from('bookings')
                .update({ status: 'declined' })
                .eq('id', id);
            
            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert(`❌ Booking ${ref} declined`);
                loadAllData();
            }
        };
        
        // Delete blocked date
        window.deleteBlockedDate = async (id) => {
            if (!confirm('Remove this blocked date?')) return;
            await supabase.from('blocked_dates').delete().eq('id', id);
            loadBlockedDates();
            loadStats();
        };
        
        // Add blocked date
        document.getElementById('addBlockBtn').addEventListener('click', async () => {
            const date = document.getElementById('newBlockDate').value;
            const reason = document.getElementById('blockReason').value;
            
            if (!date) {
                alert('Please select a date');
                return;
            }
            
            const { error } = await supabase
                .from('blocked_dates')
                .insert([{ block_date: date, reason: reason || 'Blocked by admin' }]);
            
            if (error) {
                alert('Error: ' + error.message);
            } else {
                document.getElementById('newBlockDate').value = '';
                document.getElementById('blockReason').value = '';
                loadBlockedDates();
                loadStats();
            }
        });
        
        // Tab switching
        document.getElementById('tabPendingBtn').onclick = () => {
            document.getElementById('pendingSection').classList.remove('hidden');
            document.getElementById('confirmedSection').classList.add('hidden');
            document.getElementById('blockSection').classList.add('hidden');
        };
        
        document.getElementById('tabConfirmedBtn').onclick = () => {
            document.getElementById('pendingSection').classList.add('hidden');
            document.getElementById('confirmedSection').classList.remove('hidden');
            document.getElementById('blockSection').classList.add('hidden');
        };
        
        document.getElementById('tabBlockBtn').onclick = () => {
            document.getElementById('pendingSection').classList.add('hidden');
            document.getElementById('confirmedSection').classList.add('hidden');
            document.getElementById('blockSection').classList.remove('hidden');
        };
    </script>
</body>
</html>
