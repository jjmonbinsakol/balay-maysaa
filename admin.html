<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balay Maysa · Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body { background: #f1f5f9; font-family: system-ui, 'Segoe UI', sans-serif; }
    .stat-card { transition: 0.2s; }
    .btn-approve { background: #10b981; }
    .btn-decline { background: #ef4444; }
    .status-badge-pending { background: #fef3c7; color: #b45309; }
    .status-badge-confirmed { background: #d1fae5; color: #065f46; }
  </style>
</head>
<body class="p-0 m-0">

  <!-- LOGIN PANEL (hidden after auth) -->
  <div id="loginPanel" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#2d5a3b] to-[#1e3a2f]">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <div class="text-center mb-6">
        <i class="fas fa-lock text-4xl text-[#c9a03d]"></i>
        <h2 class="text-2xl font-bold mt-2">Admin Access</h2>
        <p class="text-gray-500">Balay Maysa management</p>
      </div>
      <form id="adminLoginForm">
        <input type="text" id="adminUsername" placeholder="Username" class="w-full border p-3 rounded-lg mb-3" required>
        <input type="password" id="adminPassword" placeholder="Password" class="w-full border p-3 rounded-lg mb-4" required>
        <button type="submit" class="w-full bg-[#2d5a3b] text-white py-3 rounded-lg font-bold">Login</button>
      </form>
      <div id="loginError" class="text-red-600 text-center text-sm mt-3 hidden"></div>
    </div>
  </div>

  <!-- DASHBOARD (hidden until login) -->
  <div id="dashboard" class="hidden">
    <nav class="bg-[#2d5a3b] text-white px-6 py-4 shadow-lg flex justify-between items-center">
      <div class="flex items-center gap-2"><i class="fas fa-umbrella-beach text-xl"></i><span class="font-bold text-xl">Balay Maysa · Admin</span></div>
      <button id="logoutBtn" class="bg-red-700 px-4 py-2 rounded-lg text-sm hover:bg-red-800">Logout</button>
    </nav>

    <div class="p-6 max-w-7xl mx-auto">
      <!-- STATS CARDS -->
      <div class="grid md:grid-cols-4 gap-5 mb-8">
        <div class="bg-white p-5 rounded-xl shadow-sm border-l-8 border-[#c9a03d]"><p class="text-gray-500 text-sm">Pending</p><p id="statPending" class="text-3xl font-bold">0</p></div>
        <div class="bg-white p-5 rounded-xl shadow-sm border-l-8 border-green-500"><p class="text-gray-500 text-sm">Confirmed</p><p id="statConfirmed" class="text-3xl font-bold">0</p></div>
        <div class="bg-white p-5 rounded-xl shadow-sm border-l-8 border-blue-500"><p class="text-gray-500 text-sm">Total Bookings</p><p id="statTotal" class="text-3xl font-bold">0</p></div>
        <div class="bg-white p-5 rounded-xl shadow-sm border-l-8 border-purple-400"><p class="text-gray-500 text-sm">Blocked dates</p><p id="statBlocked" class="text-3xl font-bold">0</p></div>
      </div>

      <!-- TABS -->
      <div class="flex gap-2 border-b mb-6">
        <button id="tabPendingBtn" class="py-2 px-5 font-semibold text-[#2d5a3b] border-b-2 border-[#c9a03d]">📋 Pending requests</button>
        <button id="tabConfirmedBtn" class="py-2 px-5 font-semibold text-gray-500">✅ Confirmed</button>
        <button id="tabBlockBtn" class="py-2 px-5 font-semibold text-gray-500">🚫 Block dates</button>
      </div>

      <!-- PENDING TABLE -->
      <div id="pendingSection" class="bg-white rounded-xl shadow overflow-x-auto">
        <table class="min-w-full text-sm"><thead class="bg-gray-100"><tr><th class="p-3 text-left">Date</th><th class="p-3 text-left">Guest</th><th class="p-3 text-left">Room</th><th class="p-3 text-left">Check-in</th><th class="p-3 text-left">Check-out</th><th class="p-3 text-left">Adults</th><th class="p-3 text-left">Actions</th></tr></thead><tbody id="pendingTableBody"><tr><td colspan="7" class="text-center p-6">Loading...</td></tr></tbody></table>
      </div>

      <!-- CONFIRMED TABLE -->
      <div id="confirmedSection" class="hidden bg-white rounded-xl shadow overflow-x-auto">
        <table class="min-w-full text-sm"><thead class="bg-gray-100"><tr><th class="p-3">Guest</th><th class="p-3">Room</th><th class="p-3">Check-in</th><th class="p-3">Check-out</th><th class="p-3">Status</th></tr></thead><tbody id="confirmedTableBody"></tbody></table>
      </div>

      <!-- BLOCK DATES SECTION -->
      <div id="blockSection" class="hidden bg-white rounded-xl p-5 shadow">
        <div class="flex gap-3 flex-wrap mb-6"><input type="date" id="newBlockDate" class="border p-2 rounded"><input type="text" id="blockReason" placeholder="Reason (maintenance/event)" class="border p-2 rounded flex-1"><button id="addBlockBtn" class="bg-red-600 text-white px-5 py-2 rounded">+ Block date</button></div>
        <table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-2 text-left">Blocked date</th><th class="p-2 text-left">Reason</th><th class="p-2">Action</th></tr></thead><tbody id="blockedDatesList"></tbody></table>
      </div>
    </div>
  </div>

  <script>
    // ----------------------------- SUPABASE CONFIG (USE YOUR KEYS) -----------------------------
    const SUPABASE_URL = 'https://vhtcefsfvpeafukzdxmj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_9hJ_a1e1413lFxkhnc8aRQ_lmTFb';  // replace with your publishable key
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Admin credentials (change as you like)
    const ADMIN_USER = 'balayadmin';
    const ADMIN_PASS = 'BalayMaysa2026';

    let isLogged = false;
    // DOM elements
    const loginPanel = document.getElementById('loginPanel');
    const dashboardDiv = document.getElementById('dashboard');
    const loginForm = document.getElementById('adminLoginForm');
    const loginErrorSpan = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');

    // Tabs
    const pendingSection = document.getElementById('pendingSection');
    const confirmedSection = document.getElementById('confirmedSection');
    const blockSection = document.getElementById('blockSection');
    const tabPending = document.getElementById('tabPendingBtn');
    const tabConfirmed = document.getElementById('tabConfirmedBtn');
    const tabBlock = document.getElementById('tabBlockBtn');

    // ---------- LOGIN ----------
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('adminUsername').value;
      const pass = document.getElementById('adminPassword').value;
      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        isLogged = true;
        loginPanel.classList.add('hidden');
        dashboardDiv.classList.remove('hidden');
        loadAllAdminData();
        startAutoRefresh();
      } else {
        loginErrorSpan.classList.remove('hidden');
        loginErrorSpan.innerText = 'Invalid credentials';
        setTimeout(() => loginErrorSpan.classList.add('hidden'), 2000);
      }
    });

    logoutBtn.addEventListener('click', () => {
      isLogged = false;
      dashboardDiv.classList.add('hidden');
      loginPanel.classList.remove('hidden');
      document.getElementById('adminUsername').value = '';
      document.getElementById('adminPassword').value = '';
    });

    // ---------- FETCH DATA FUNCTIONS ----------
    async function loadPending() {
      const { data, error } = await supabase.from('bookings').select('*').eq('status', 'pending_approval').order('created_at', { ascending: true });
      const tbody = document.getElementById('pendingTableBody');
      if (error || !data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-gray-400">No pending requests</td></tr>'; return; }
      tbody.innerHTML = data.map(b => `
        <tr class="border-b hover:bg-gray-50">
          <td class="p-3">${new Date(b.created_at).toLocaleDateString()}</td>
          <td class="p-3 font-medium">${b.guest_name || b.guest_email}</td>
          <td class="p-3 capitalize">${b.room_type}</td>
          <td class="p-3">${b.check_in_date}</td><td class="p-3">${b.check_out_date}</td><td class="p-3">${b.adults}</td>
          <td class="p-3"><button class="btn-approve text-white px-3 py-1 rounded mr-2" onclick="approveBooking('${b.id}')">✓ Confirm</button><button class="btn-decline text-white px-3 py-1 rounded" onclick="declineBooking('${b.id}')">✗ Decline</button></td>
        </tr>`).join('');
    }

    async function loadConfirmed() {
      const { data } = await supabase.from('bookings').select('*').eq('status', 'confirmed').order('check_in_date', { ascending: true });
      const tbody = document.getElementById('confirmedTableBody');
      if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4">No confirmed bookings</td></tr>'; return; }
      tbody.innerHTML = data.map(b => `<tr class="border-b"><td class="p-3">${b.guest_name || b.guest_email}</td><td class="p-3 capitalize">${b.room_type}</td><td class="p-3">${b.check_in_date}</td><td class="p-3">${b.check_out_date}</td><td class="p-3"><span class="status-badge-confirmed px-2 py-1 rounded text-xs">Confirmed</span></td></tr>`).join('');
    }

    async function loadStats() {
      const { count: pending } = await supabase.from('bookings').select('*', { count: 'exact', head: true }).eq('status', 'pending_approval');
      const { count: confirmed } = await supabase.from('bookings').select('*', { count: 'exact', head: true }).eq('status', 'confirmed');
      const { count: total } = await supabase.from('bookings').select('*', { count: 'exact', head: true });
      const { count: blockedCount } = await supabase.from('blocked_dates').select('*', { count: 'exact', head: true });
      document.getElementById('statPending').innerText = pending || 0;
      document.getElementById('statConfirmed').innerText = confirmed || 0;
      document.getElementById('statTotal').innerText = total || 0;
      document.getElementById('statBlocked').innerText = blockedCount || 0;
    }

    async function loadBlockedDates() {
      const { data } = await supabase.from('blocked_dates').select('*').order('block_date', { ascending: true });
      const tbody = document.getElementById('blockedDatesList');
      if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="3" class="text-center p-3 text-gray-400">No blocked dates</td></tr>'; return; }
      tbody.innerHTML = data.map(d => `<tr><td class="p-2">${d.block_date}</td><td class="p-2">${d.reason || '—'}</td><td class="p-2"><button onclick="deleteBlockedDate('${d.id}')" class="text-red-500 text-sm"><i class="fas fa-trash"></i> remove</button></td></tr>`).join('');
    }

    // GLOBALS for admin actions
    window.approveBooking = async (id) => {
      if (!confirm('Confirm booking?')) return;
      const { error } = await supabase.from('bookings').update({ status: 'confirmed', confirmed_at: new Date().toISOString() }).eq('id', id);
      if (error) alert('Error: ' + error.message);
      else { loadPending(); loadConfirmed(); loadStats(); }
    };
    window.declineBooking = async (id) => {
      if (!confirm('Decline this request?')) return;
      await supabase.from('bookings').update({ status: 'declined' }).eq('id', id);
      loadPending(); loadConfirmed(); loadStats();
    };
    window.deleteBlockedDate = async (id) => {
      await supabase.from('blocked_dates').delete().eq('id', id);
      loadBlockedDates(); loadStats();
    };

    document.getElementById('addBlockBtn')?.addEventListener('click', async () => {
      const date = document.getElementById('newBlockDate').value;
      const reason = document.getElementById('blockReason').value;
      if (!date) return alert('Select a date');
      const { error } = await supabase.from('blocked_dates').insert([{ block_date: date, reason: reason || 'Admin blocked' }]);
      if (error) alert('Error: ' + error.message);
      else { document.getElementById('newBlockDate').value = ''; document.getElementById('blockReason').value = ''; loadBlockedDates(); loadStats(); }
    });

    async function loadAllAdminData() { await Promise.all([loadPending(), loadConfirmed(), loadStats(), loadBlockedDates()]); }

    // TABS
    tabPending.addEventListener('click', () => { pendingSection.classList.remove('hidden'); confirmedSection.classList.add('hidden'); blockSection.classList.add('hidden'); tabPending.classList.add('border-b-2','border-[#c9a03d]','text-[#2d5a3b]'); tabConfirmed.classList.remove('border-b-2','border-[#c9a03d]','text-[#2d5a3b]'); tabBlock.classList.remove('border-b-2','border-[#c9a03d]','text-[#2d5a3b]'); });
    tabConfirmed.addEventListener('click', () => { pendingSection.classList.add('hidden'); confirmedSection.classList.remove('hidden'); blockSection.classList.add('hidden'); tabConfirmed.classList.add('border-b-2','border-[#c9a03d]','text-[#2d5a3b]'); tabPending.classList.remove('border-b-2','border-[#c9a03d]','text-[#2d5a3b]'); tabBlock.classList.remove('border-b-2','border-[#c9a03d]','text-[#2d5a3b]'); });
    tabBlock.addEventListener('click', () => { pendingSection.classList.add('hidden'); confirmedSection.classList.add('hidden'); blockSection.classList.remove('hidden'); tabBlock.classList.add('border-b-2','border-[#c9a03d]','text-[#2d5a3b]'); tabPending.classList.remove('border-b-2','border-[#c9a03d]','text-[#2d5a3b]'); tabConfirmed.classList.remove('border-b-2','border-[#c9a03d]','text-[#2d5a3b]'); });

    let refreshInterval;
    function startAutoRefresh() { if (refreshInterval) clearInterval(refreshInterval); refreshInterval = setInterval(() => { if (isLogged) loadAllAdminData(); }, 30000); }
  </script>
</body>
</html>
